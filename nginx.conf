server {
    listen 3001;
    root /usr/share/nginx/html;
    index index.html;

    # Sicherheits-Header zentral als Snippet: add_header in einem location-Block
    # überschreibt sonst ALLE Header der Ebene darüber.
    # HSTS setzt Caddy bzw. der Edge, nicht dieser Container.

    # Gehashte Vite-Bundles (name-HASH.js/css, Fonts): ewig cachebar.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Nicht gehashte Dateien (Logos, Favicon, robots, sitemap): kurz cachen.
    location ~* \.(png|jpg|jpeg|svg|ico|webp|mp3|txt|xml|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # SPA-Fallback. index.html nie cachen, sonst zeigen alte Hashes ins Leere.
    # Unbekannte Pfade liefern die App (die rendert die 404-Seite), echte
    # 404-Statuscodes gibt es nur für fehlende Dateien oben.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1000;
}
