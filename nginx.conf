server {
    listen 3001;
    root /usr/share/nginx/html;
    index index.html;

    # HSTS setzt der zentrale Caddy, nicht dieser Container.

    # Statische Astro-Seiten: /werte → /werte/index.html, kein SPA-Fallback mehr
    absolute_redirect off;

    # Alte Services-Seite → Werte-Seite
    location = /services    { return 301 /werte; }
    location = /en/services/ { return 301 /en/values; }
    location = /services/   { return 301 /werte; }
    location = /en/services { return 301 /en/values; }

    # Trailing Slash entfernen (trailingSlash: 'never')
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|webp|mp3)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    include /etc/nginx/conf.d/security-headers.inc;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1000;
}
