# flowstate.foundation (React/Vite) – hinter dem zentralen Caddy (/home/nils/caddy).
# Kein veröffentlichter Port: Caddy erreicht den Container über das proxy-Netz.
services:
  flowstate-foundation-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_SUPABASE_FN_URL: ${VITE_SUPABASE_FN_URL}
        VITE_FLOWSTATE_APP: ${VITE_FLOWSTATE_APP}
        VITE_CAL_URL: ${VITE_CAL_URL}
        VITE_WA_URL: ${VITE_WA_URL}
        VITE_WA_PHONE: ${VITE_WA_PHONE}
    image: flowstate-foundation-web:latest
    container_name: flowstate-foundation-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    external: true
